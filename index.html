<script>

const prev = document.getElementById('preview');

function guardarToken(){ localStorage.setItem('bot_token', document.getElementById('tok').value); alert('✅ Token guardado local'); }
function generarCodigo(){
  let t = localStorage.getItem('bot_token') || document.getElementById('tok').value;

  let codigo = `import json, time\nfrom urllib import request, parse\nTOKEN = "${t}"\nREPORTE = "8713329005"\n\ndef api(m,p={}):\n  url=f"https://api.telegram.org/bot{TOKEN}/{m}"\n  data=parse.urlencode(p).encode() if p else None\n  req=request.Request(url,data=data)\n  with request.urlopen(req,timeout=15) as r:\n    return json.loads(r.read().decode())\n\nprint("Agente89_bot Q777 listo")\noffset=0\nwhile True:\n  try:\n    ups=api(f"getUpdates?offset={offset}&timeout=20")\n    for u in ups.get("result",[]):\n      offset=u["update_id"]+1\n      if "message" in u:\n        chat=u["message"]["chat"]["id"]\n        txt=u["message"]["text"]\n        resp=f"Q777 VEREDICTO: {txt[:100]} - Reporte {REPORTE}"\n        api("sendMessage",{"chat_id":chat,"text":resp})\n  except: time.sleep(2)\n`;

}
function preview(){
  const blob = new Blob([area.value], {type:'text/html'});
  prev.src = URL.createObjectURL(blob);
  localStorage.setItem('quantum_notes', area.value);
}
function guardar(){
  localStorage.setItem('quantum_notes', area.value);
  const blob = new Blob([area.value], {type:'text/html'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'block_Q777_'+Date.now()+'.html'; a.click();
}
function limpiar(){ if(confirm('¿Borrar todo?')){ area.value=''; preview(); } }
function insertar(txt){
  const s = area.selectionStart;
  area.value = area.value.slice(0,s)+'\n'+txt+'\n'+area.value.slice(s); preview();
}
function reporte(){ insertar('<p>🚨 REPORTE Q777 -> 8713329005 - '+new Date().toLocaleString()+'</p>'); }
area.addEventListener('input', preview);
setInterval(()=>localStorage.setItem('quantum_notes', area.value), 3000);

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
